<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>

  <!-- ✅ Bootstrap for responsiveness -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- ✅ Your custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

  <div class="container py-4">
    <!-- Header -->
    <header class="text-center mb-4">
      <h1 class="fw-bold text-primary">Student Management System</h1>
    </header>

    <!-- Search + Buttons -->
    <div class="row gy-2 align-items-center">
      <!-- Search -->
      <div class="col-12 col-md-6">
        <div class="input-group">
          <input type="text" id="searchInput" class="form-control" placeholder="Search by Reg No, Name, Email, Mobile, or Address...">
          <button id="clearSearch" class="btn btn-outline-secondary">Clear</button>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="col-12 col-md-6 text-md-end text-center">
        <button id="addStudentBtn" class="btn btn-primary mb-1">Add New Student</button>
        <button id="refreshBtn" class="btn btn-secondary mb-1">Refresh</button>
        <label for="importFile" class="btn btn-outline-info mb-1">Import Excel</label>
        <input type="file" id="importFile" accept=".xlsx,.xls" style="display: none;">
        <button id="exportBtn" class="btn btn-outline-success mb-1">Export Excel</button>
        <button id="clearAllBtn" class="btn btn-danger mb-1">Clear All Data</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive mt-4">
      <table id="studentsTable" class="table table-bordered table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>Reg No</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Address</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody">
          <tr>
            <td colspan="6" class="text-center">Loading students...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- No results message -->
    <div id="noResults" class="alert alert-warning text-center mt-3" style="display: none;">
      No students found matching your search.
    </div>
  </div>

  <!-- Modal -->
  <div id="studentModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalTitle">Add New Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="studentForm" class="p-3">
          <input type="hidden" id="studentId">
          
          <div class="mb-3">
            <label for="regNo" class="form-label">Registration Number *</label>
            <input type="text" id="regNo" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="name" class="form-label">Name *</label>
            <input type="text" id="name" class="form-control" required placeholder="Enter full name">
            <small class="text-muted">Only letters and spaces allowed</small>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email ID *</label>
            <input type="email" id="email" class="form-control" required placeholder="example@email.com">
          </div>

          <div class="mb-3">
            <label for="mobile" class="form-label">Mobile Number *</label>
            <input type="tel" id="mobile" class="form-control" required maxlength="10" pattern="[0-9]{10}" placeholder="1234567890">
          </div>

          <div class="mb-3">
            <label for="address" class="form-label">Address *</label>
            <textarea id="address" class="form-control" rows="3" required placeholder="Enter complete address"></textarea>
          </div>

          <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast message -->
  <div id="toast" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
    <!-- JS will fill toast messages -->
  </div>

  <!-- JS files -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
